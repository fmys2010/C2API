name = "chatgpt2api-mail-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 环境变量（可在部署时通过 wrangler deploy 或在 Cloudflare 控制台 Worker -> Settings -> Variables 配置）
[vars]
# 方式 A：直接推送到你的后端 Webhook（需公网/Cloudflare Tunnel）
WEBHOOK_URL = "https://your-domain.com/api/register/webhook/cf-worker"

# Webhook 鉴权密钥
WEBHOOK_SECRET = "1145141919810"

# 方式 B（备选免穿透）：若本地 Windows 无公网 IP / 未配 Tunnel，填写专属 topic
NTFY_TOPIC = "1145141919810"
