# ==============================================================================
# C2API - Docker Compose (标准版本 / 不带 CF 绕过)
# 适用场景: 海外 VPS、已有透明/全局代理环境、或无需 Cloudflare 5秒盾/Turnstile 穿透的直连部署
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/fmys2010/c2api:main
    container_name: c2api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
      - ./services:/app/services
      - ./api:/app/api
    environment:
      # 纯 SQLite 存储引擎（持久化至 ./data/accounts.db）
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      
      # 访问鉴权 API Key（对应请求头 Authorization: Bearer <KEY>）
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-chatgpt2api}
      
      # 可选：自定义服务外网访问基础地址
      # CHATGPT2API_BASE_URL: https://api.your-domain.com

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/public/config || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
